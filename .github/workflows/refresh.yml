name: Cập nhật hằng ngày

# Thay cho cron trên laptop. Laptop ngủ thì kho đóng băng — đã xảy ra thật.
#
# Ba secret cần đặt ở Settings > Secrets and variables > Actions:
#   CLOUDFLARE_API_TOKEN   quyền: Workers Scripts:Edit, D1:Edit
#   CLOUDFLARE_ACCOUNT_ID
# Và một biến thường (Settings > Variables):
#   CF_ANALYTICS_TOKEN     beacon token Web Analytics — KHÔNG phải bí mật
#   SITE_URL
on:
  schedule:
    # 05:17 giờ Việt Nam = 22:17 UTC hôm trước.
    # Phút 17 chứ không phải 00: phút tròn là lúc runner GitHub đông nhất.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Đẩy lên production sau khi chấm xong"
        type: boolean
        default: true

concurrency:
  # Hai lần chạy chồng nhau sẽ ghi đè jobs.json của nhau.
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write        # để commit lại slug_state.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Bước kéo toàn kho cần ~2h; mốc 90 phút đã huỷ ba đêm liên tiếp mà không
    # ai hay — và vì bậc poll chỉ được ghi khi chạy trọn, mỗi đêm lại kéo đúng
    # chỗ cũ rồi chết đúng chỗ cũ. Repo public nên phút Actions miễn phí.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      # Token chỉ được DÙNG ở bước nạp D1, tức ~25 phút sau khi bắt đầu (bước
      # kéo tin chiếm phần lớn). Sai quyền mà đợi 25 phút mới biết là vòng lặp
      # sửa lỗi tệ. Kiểm ngay đầu, hỏng thì dừng sau ~40 giây.
      - name: Kiểm thông tin xác thực Cloudflare
        if: github.event_name == 'schedule' || inputs.deploy == true
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || { echo "::error::thiếu secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::thiếu secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx wrangler whoami || { echo "::error::token không hợp lệ"; exit 1; }
          # Đọc thử D1: bắt đúng trường hợp token thiếu quyền D1:Edit
          npx wrangler d1 list \
            || { echo "::error::token thiếu quyền D1 — cần D1:Edit"; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # jobs.json 34 MB, không commit được (đổi hằng ngày -> ~1 GB/tháng repo).
      # Cache giữ nó ấm giữa các lần chạy. Bị đuổi thì lần sau kéo toàn bộ
      # (~68 phút thay vì 16) — chậm chứ không hỏng.
      - name: Khôi phục kho
        uses: actions/cache/restore@v4
        with:
          path: jobs.json
          key: jobs-${{ github.run_id }}
          restore-keys: jobs-

      - name: Kéo + chấm nhãn
        run: python3 -u tools/export_jobs.py -o jobs.json

      # export_db.py gọi tools/gates.py — vi phạm C1..C5 thì thoát mã 1 ở đây,
      # trước khi bất kỳ thứ gì chạm tới production.
      - name: Cổng C1..C5 + xuất SQLite/seed
        run: python3 -u tools/export_db.py

      # Bậc poll là trạng thái DUY NHẤT không dựng lại được và không nằm trong
      # jobs.json. Ghi NGAY sau khi dữ liệu qua cổng — để trước bước deploy thì
      # deploy hỏng không kéo mất tiến độ kéo tin (đã mất ba đêm vì để cuối).
      - name: Ghi lại bậc poll
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/slug_state.json
          git diff --quiet --cached || git commit -m "chore: cập nhật bậc poll [skip ci]"
          git push

      - name: Dựng bản tĩnh (đường lui)
        run: python3 build.py

      - name: Lưu kho
        uses: actions/cache/save@v4
        if: always()
        with:
          path: jobs.json
          key: jobs-${{ github.run_id }}

      - run: npm ci
        working-directory: web
        if: github.event_name == 'schedule' || inputs.deploy == true

      # BẮT BUỘC trước khi build: `next build` chạy generateStaticParams, và
      # hàm đó TRUY VẤN D1. Trên runner mới, D1 local rỗng ⇒ build chết với
      # "no such table: company". Seed local trước, seed remote sau.
      - name: Seed D1 cục bộ (cho bước build)
        if: github.event_name == 'schedule' || inputs.deploy == true
        working-directory: web
        run: |
          for f in ../data/seed-*.sql; do
            npx wrangler d1 execute viec-remote --local --file="$f"
          done

      # Tệp cuối (seed-NN-swap.sql) là bước hoán đổi. Đứt trước nó thì
      # production vẫn chạy dữ liệu hôm qua — xem tools/export_db.py.
      - name: Nạp D1
        if: github.event_name == 'schedule' || inputs.deploy == true
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in ../data/seed-*.sql; do
            echo "→ $f"
            npx wrangler d1 execute viec-remote --remote --file="$f" -y
          done

      # Xoá dữ liệu L2 quá hạn. Đây là NGHĨA VỤ theo Điều 25.1.c Luật 91/2025,
      # không phải dọn dẹp cho gọn — nên nó chạy hằng ngày kể cả khi L2 đang
      # tắt (bảng rỗng ⇒ không-thao-tác), và báo số dòng trước/sau để một lần
      # xoá bất thường không trôi qua im lặng.
      - name: Xoá dữ liệu L2 quá hạn (C8)
        if: github.event_name == 'schedule' || inputs.deploy == true
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          count() {
            npx wrangler d1 execute viec-remote --remote --json \
              --command "SELECT (SELECT count(*) FROM engineer) e, (SELECT count(*) FROM consent) c" \
              2>/dev/null | tr -d ' \n'
          }
          echo "trước: $(count)"
          npx wrangler d1 execute viec-remote --remote --file=../tools/purge.sql -y
          echo "sau:   $(count)"
          # Khẳng định lời hứa đã được giữ — cổng ở CI không thấy production,
          # nên chỗ DUY NHẤT kiểm được là ngay sau khi xoá, bằng chính secrets này.
          overdue=$(npx wrangler d1 execute viec-remote --remote --json --command \
            "SELECT (SELECT count(*) FROM subscriber WHERE confirmed=0 AND created_at < datetime('now','-8 days'))
              + (SELECT count(*) FROM engineer WHERE purge_after < datetime('now','-1 day')) n" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['results'][0]['n'])")
          [ "$overdue" = "0" ] || { echo "::error::$overdue bản ghi quá hạn xoá vẫn còn sau khi purge chạy"; exit 1; }

      - name: Deploy Worker
        if: github.event_name == 'schedule' || inputs.deploy == true
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Beacon token của Web Analytics KHÔNG phải bí mật — nó nằm ngay trong
          # HTML ai xem nguồn cũng thấy. Dùng variable để debug được; vẫn nhận
          # secret nếu ai đó đã đặt kiểu đó.
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN || secrets.CF_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy

      # Cron deploy lúc 22:17 UTC không có ai nhìn. Không kiểm thì một lần
      # refresh hỏng là site chết tới sáng — bước này làm workflow ĐỎ và
      # GitHub gửi thư báo. Cùng tools/smoke.sh với deploy.sh, không chép tay.
      - name: Kiểm khói trên bản vừa deploy
        if: github.event_name == 'schedule' || inputs.deploy == true
        run: tools/smoke.sh "${{ vars.SITE_URL || 'https://viec-remote.nguyenduchuy27111997.workers.dev' }}"

      - name: Tóm tắt
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, collections, os
          if not os.path.exists("jobs.json"):
              print("### ❌ Không có jobs.json — bước kéo đã thất bại"); raise SystemExit
          d = json.load(open("jobs.json"))
          n = collections.Counter(j["eligibility"] for j in d)
          comp = {j["company_slug"] for j in d}
          ok = {j["company_slug"] for j in d if j["eligibility"] == "worldwide"}
          print("### Kho sau cập nhật\n")
          print("| | |\n|---|---|")
          print(f"| Tin | {len(d):,} |")
          print(f"| Công ty | {len(comp):,} |")
          print(f"| Công ty tuyển được ở VN | **{len(ok)}** |")
          print(f"| Tin mở | {n['worldwide']} |")
          print(f"| Bị giới hạn địa lý | {n['excluded']:,} |")
          PY
